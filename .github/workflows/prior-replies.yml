name: prior.replies

on:
  # LIVE: every 15 min mention engagement, 12 replies/day cap.
  # Uses app-only bearer for reads (no rotation, no refresh) + OAuth 1.0a for writes.
  schedule:
    # every 10 min — Grok-tier responsiveness. Runs idle if no mentions
    # match the trigger, so cost only scales with actual engagement.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (classify but do not post)'
        required: false
        default: 'false'
      max_per_day:
        description: 'Override daily reply cap (default 12)'
        required: false
        default: '12'
      min_followers:
        description: 'Min follower count to engage (default 10, set 0 at launch)'
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: prior-replies
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Run replies.py
        env:
          ANTHROPIC_API_KEY:               ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY:                       ${{ secrets.X_API_KEY }}
          X_API_SECRET:                    ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:                  ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:           ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN:                  ${{ secrets.X_BEARER_TOKEN }}
          # Opus for replies — these are high-visibility, answer-the-room
          # moments where quality > cost. Same justification on agent-engage.
          PRIOR_MODEL:                     'claude-opus-4-5'
          PRIOR_DRY_RUN:                   ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          PRIOR_REPLIES_MAX_PER_DAY:       ${{ github.event.inputs.max_per_day || '12' }}
          PRIOR_REPLIES_MIN_FOLLOWERS:     ${{ github.event.inputs.min_followers || '10' }}
        run: python scripts/replies.py

      - name: Commit updates
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "prior.replies"
          git config user.email "prior-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "replies: $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          else
            echo "no changes"
          fi
