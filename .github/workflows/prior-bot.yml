name: prior.agent

on:
  # PAUSED: schedule disabled while X account is in verification.
  # Re-enable by uncommenting the schedule block below.
  # schedule:
  #   - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual X post)'
        required: false
        default: 'false'

# Allow committing the updated data/log.json back to the repo
permissions:
  contents: write

concurrency:
  group: prior-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Run prior_bot.py
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          PRIOR_DRY_RUN:         ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python scripts/prior_bot.py

      - name: Commit updated log
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "prior.agent"
          git config user.email "prior-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          if [[ -n "$(git status --porcelain data/log.json)" ]]; then
            git add data/log.json
            git commit -m "prior: log update $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          else
            echo "no changes to log"
          fi
