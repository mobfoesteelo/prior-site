name: prior.post-once

# Manual one-off post — pin tweets, manifestos, announcements.
# Use carefully: this counts toward the X 17/day write budget.

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Tweet text (≤ 280 chars)'
        required: true
      dry_run:
        description: 'Dry run (print, do not post)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Post
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          PRIOR_POST_TEXT:       ${{ github.event.inputs.text }}
          PRIOR_DRY_RUN:         ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python scripts/post_one.py
      - name: Commit log
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "prior.agent"
          git config user.email "prior-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          if [[ -n "$(git status --porcelain data/log.json)" ]]; then
            git add data/log.json
            git commit -m "post-once: $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
