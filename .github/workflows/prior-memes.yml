name: prior.memes

on:
  # Every 8h at :42 — 3 memes/day max
  schedule:
    - cron: '42 */8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual X post)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: prior-memes
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Run post_meme.py
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          PRIOR_DRY_RUN:         ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python scripts/post_meme.py

      - name: Commit state + log
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "prior.memes"
          git config user.email "prior-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "memes: $(date -u +'%Y-%m-%dT%H:%MZ') · meme posted"
            git push
          else
            echo "no state changes"
          fi
