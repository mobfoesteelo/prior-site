name: prior.insider-watch

# Daily "INSIDER WATCH" thread — synthesizes 24h of insider-trading signal
# from public feeds + on-chain alerts, cross-references the archive,
# posts a 5-7 tweet thread on X, persists the report to data/insider-watch.json
# (consumed by /watch streamable visualization).

on:
  schedule:
    # 14:00 UTC daily — 10am ET / 7am PT, captures overnight + morning news
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate report but do not post to X'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: prior-insider-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Run insider-watch
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          PRIOR_DRY_RUN:         ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python scripts/insider_watch.py
      - name: Commit report + log
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "prior.watch"
          git config user.email "prior-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "watch: $(date -u +'%Y-%m-%dT%H:%MZ') · daily insider report"
            git push
          fi
