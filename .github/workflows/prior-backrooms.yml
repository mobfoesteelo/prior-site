name: prior.backrooms

on:
  # Daily — one new self-conversation per day, 03:11 UTC
  schedule:
    - cron: '11 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print, do not commit)'
        required: false
        default: 'false'
      turns:
        description: 'Turns per side (total = 2x)'
        required: false
        default: '15'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Generate backroom conversation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRIOR_BR_TURNS:    ${{ github.event.inputs.turns || '15' }}
          PRIOR_BR_DRY_RUN:  ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python scripts/generate_backroom.py

      - name: Commit archive
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "prior.backrooms"
          git config user.email "prior-bot@users.noreply.github.com"
          if [[ -n "$(git status --porcelain api/backrooms.json)" ]]; then
            git add api/backrooms.json
            git commit -m "backrooms: $(date -u +'%Y-%m-%d') · self-conversation archived"
            git push
          else
            echo "no changes"
          fi
