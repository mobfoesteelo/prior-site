name: prior.weekly-recap

# Sundays 17:00 UTC. Synthesizes the week into a 5-7 tweet recap thread.

on:
  schedule:
    - cron: '0 17 * * 0'   # Sunday 17:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate but do not post'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: prior-weekly-recap
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Run weekly recap
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          PRIOR_MODEL:           'claude-opus-4-5'   # weekly is flagship — Opus
          PRIOR_DRY_RUN:         ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python scripts/weekly_recap.py
      - name: Commit
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "prior.recap"
          git config user.email "prior-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "recap: $(date -u +'%Y-%m-%dT%H:%MZ') · weekly thread"
            git push
          fi
