name: prior.agent-engage

# Engages high-leverage X accounts (other AI agents, big crypto-twitter
# analysts) with archive-receipt replies. Caps at 4/day, 6h cooldown
# per target. Filters with Claude before any post.

on:
  schedule:
    # every 2 hours, but the daily cap (4) keeps actual posting under control
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Classify + generate but do not post'
        required: false
        default: 'false'
      max_per_day:
        description: 'Override daily engagement cap (default 4)'
        required: false
        default: '4'

permissions:
  contents: write

concurrency:
  group: prior-agent-engage
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Run agent-engage
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY:                ${{ secrets.X_API_KEY }}
          X_API_SECRET:             ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:           ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:    ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN:           ${{ secrets.X_BEARER_TOKEN }}
          PRIOR_DRY_RUN:            ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          PRIOR_AGENT_MAX_PER_DAY:  ${{ github.event.inputs.max_per_day || '4' }}
        run: python scripts/agent_engage.py
      - name: Commit logs
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "prior.engage"
          git config user.email "prior-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "engage: $(date -u +'%Y-%m-%dT%H:%MZ') · target-account engagement"
            git push
          fi
